<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Admin</title>
<meta name="robots" content="noindex"><meta name="description" content="Computer repair and IT support, online and onsite, in Indore and Jabalpur.">
<link rel="icon" href="logo-icon.jpg"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div id="hdr"></div>
<main>
<div class="admin" id="login"><h2>Admin login</h2>
<form id="lf" style="display:grid;gap:12px"><div><label for="u">Username</label><input id="u" autocomplete="username" required></div>
<div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
<p class="err" id="err"></p><button class="btn hot" type="submit">Log in</button></form></div>
<div class="admin wide" id="editor" hidden><h2>Edit website</h2>
<p class="note">1) Change the fields and press Save to preview in this browser. 2) Press Download content.js and upload it to your website, replacing the old content.js. Then every visitor sees the changes.</p>
<div id="fields" style="display:grid;gap:12px"></div>
<div class="btns"><button class="btn hot" id="sv" type="button">Save preview</button><button class="btn" id="dl" type="button">Download content.js</button><button class="btn" id="rs" type="button">Discard preview</button><button class="btn" id="lo" type="button">Log out</button></div><p class="note" id="msg"></p></div></main>
<div id="ftr"></div>
<script src="content.js"></script><script src="site.js"></script><script>
var H="c0d68ff9eebe1b034a3ac746a09528388870d4baa6f7fa31b941bc61a139c204";
var FIELDS=[["name","Business name"],["tagline","Tagline"],["phone","Phone (10 digits)"],["email","Email"],["owner","Owner name"],["address","Address"],["hero","Home page headline"],["lead","Home page intro","t"],["cities","Cities (comma separated)"],["services","Services (one per line: Title | Description)","t6"]];
function $(i){return document.getElementById(i)}
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
function build(){var b=$('fields');if(b.children.length)return;FIELDS.forEach(function(f){var d=document.createElement('div'),l=document.createElement('label'),i=document.createElement(f[2]?'textarea':'input');l.textContent=f[1];l.htmlFor='f_'+f[0];i.id='f_'+f[0];if(f[2])i.rows=f[2]=='t6'?7:3;d.appendChild(l);d.appendChild(i);b.appendChild(d)})}
function fill(){build();var S=window.SITE;FIELDS.forEach(function(f){var v=S[f[0]];if(f[0]=='cities')v=(v||[]).join(', ');if(f[0]=='services')v=(v||[]).map(function(s){return s[0]+' | '+s[1]}).join('\n');$('f_'+f[0]).value=v||''})}
function collect(){var o={};FIELDS.forEach(function(f){var v=$('f_'+f[0]).value.trim();if(f[0]=='cities')v=v.split(',').map(function(x){return x.trim()}).filter(Boolean);else if(f[0]=='services')v=v.split('\n').filter(function(x){return x.trim()}).map(function(x){var p=x.split('|');return [p[0].trim(),(p.slice(1).join('|')||'').trim()]});o[f[0]]=v});return o}
function show(){$('login').hidden=true;$('editor').hidden=false;fill()}
if(sessionStorage.getItem('cf-auth')==='1')show();
$('lf').onsubmit=function(e){e.preventDefault();sha('clickfix|'+$('u').value+'|'+$('pw').value).then(function(h){if(h===H){sessionStorage.setItem('cf-auth','1');show()}else $('err').textContent='Wrong username or password.'}).catch(function(){$('err').textContent='Login needs a secure (https) page.'})};
$('sv').onclick=function(){try{localStorage.setItem('cf-preview',JSON.stringify(collect()));$('msg').textContent='Saved. Open the other pages in this browser to preview.'}catch(e){$('msg').textContent='Could not save.'}};
$('dl').onclick=function(){var t='window.SITE_DEFAULTS='+JSON.stringify(collect(),null,1)+';\n',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/javascript'}));a.download='content.js';a.click()};
$('rs').onclick=function(){try{localStorage.removeItem('cf-preview')}catch(e){}location.reload()};
$('lo').onclick=function(){sessionStorage.removeItem('cf-auth');location.reload()};
</script>
</body></html>
