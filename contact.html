<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Contact</title>
<meta name="description" content="Computer repair and IT support, online and onsite, in Indore and Jabalpur.">
<link rel="icon" href="logo-icon.jpg"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div id="hdr"></div>
<main><div class="wrap pagehead"><h1>Talk to a technician now</h1></div>
<section class="contact"><div class="wrap"><div class="grid">
<div><a class="num" data-tel><span data-f="phone"></span></a><p>Owner: <span data-f="owner"></span></p><p data-f="address"></p><p>Email: <a data-mail></a></p></div>
<form id="f"><div><label for="n">Your name</label><input id="n" required></div>
<div><label for="c">City</label><select id="c"></select></div>
<div><label for="t">Support type</label><select id="t"><option>Online support</option><option>Onsite visit</option></select></div>
<div><label for="p">What's the problem?</label><textarea id="p" rows="3" required></textarea></div>
<button class="btn hot" type="submit">Send on WhatsApp</button></form></div></div></section>
<section><div class="wrap"><h2>Where we work</h2><div class="cities" id="cities"></div></div></section></main>
<div id="ftr"></div>
<script src="content.js"></script><script src="site.js"></script>
</body></html>
