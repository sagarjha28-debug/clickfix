<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Book a Service or Contact Us</title>
<meta name="description" content="Book computer repair or remote support in Indore and Jabalpur, or contact ClickFix Computer by phone, WhatsApp or email.">
<meta property="og:title" content="Book a Service or Contact Us"><meta property="og:description" content="Book computer repair or remote support in Indore and Jabalpur, or contact ClickFix Computer by phone, WhatsApp or email."><meta property="og:image" content="logo.jpg">
<link rel="icon" href="logo-icon.jpg"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div id="hdr"></div>
<main><div class="wrap pagehead"><h1>Book a Service</h1></div>
<section><div class="wrap cgrid"><div><h2 style="font-size:26px">Talk to us</h2><a class="num" data-tel><span data-f="phone"></span></a><p><a class="btn wa" data-wa></a></p><p>Email: <a class="lnk" data-mail></a></p><p data-f="hours"></p><p>Owner: <span data-f="owner"></span></p><p data-f="address"></p></div>
<div class="formbox" id="book"><h2 style="font-size:26px;margin-bottom:14px">Booking request</h2>
<form id="bf" novalidate>
<div><label for="bn">Your name</label><input id="bn" autocomplete="name" required></div>
<div class="two"><div><label for="bp">Phone number</label><input id="bp" type="tel" inputmode="tel" autocomplete="tel" placeholder="10-digit mobile number" required></div><div><label for="bcity">City</label><select id="bcity" required></select></div></div>
<div><label for="bsvc">Service required</label><select id="bsvc" required></select></div>
<fieldset><legend>Support type</legend><div class="radios"><label><input type="radio" name="mode" id="m_remote" value="remote"> Remote support</label><label><input type="radio" name="mode" id="m_doorstep" value="doorstep"> Doorstep visit</label></div></fieldset>
<div class="two"><div><label for="bdate">Preferred date</label><input id="bdate" type="date" required></div><div><label for="btime">Preferred time</label><input id="btime" type="time" required></div></div>
<div><label for="bdesc">Short description of the problem</label><textarea id="bdesc" rows="3" required></textarea></div>
<div class="err" id="bferr" role="alert"></div>
<button class="btn hot" type="submit">Send request on WhatsApp</button>
<p class="note" id="bfok" aria-live="polite"></p>
<p class="note">This form opens WhatsApp with your details filled in. Your request is submitted only when you press Send there.</p></form></div></div></section></main>
<div id="ftr"></div>
<script src="content.js"></script><script src="site.js"></script>
</body></html>
